# ── Root SonarQube configuration ──
sonar.projectKey=matchy-platform
sonar.projectName=Matchy Platform
sonar.projectVersion=1.0

# Sources
sonar.sources=src,backend,services/ml-prediction-service
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  **/target/**,\
  **/*.spec.ts,\
  **/test/**,\
  **/__tests__/**,\
  **/coverage/**,\
  **/.angular/**

# Language-specific
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.java.binaries=**/target/classes
sonar.java.test.binaries=**/target/test-classes
sonar.java.surefire.report=**/target/surefire-reports/*.xml

# Encoding
sonar.sourceEncoding=UTF-8
