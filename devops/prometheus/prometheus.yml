global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'matchy-monitor'
    environment: 'development'

rule_files:
  - "alert.rules.yml"

scrape_configs:

  # ── Prometheus itself ──
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Eureka Server ──
  - job_name: 'eureka-server'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8761']
    relabel_configs:
      - target_label: service
        replacement: 'eureka-server'

  # ── API Gateway ──
  - job_name: 'api-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8091']
    relabel_configs:
      - target_label: service
        replacement: 'api-gateway'

  # ── Event Service ──
  - job_name: 'event-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8081']
    relabel_configs:
      - target_label: service
        replacement: 'event-service'

  # ── Content Service ──
  - job_name: 'content-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8083']
    relabel_configs:
      - target_label: service
        replacement: 'content-service'

  # ── Subscription Service ──
  - job_name: 'subscription-service'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['host.docker.internal:8084']
    relabel_configs:
      - target_label: service
        replacement: 'subscription-service'

  # ── Backend Service (Node.js) ──
  - job_name: 'backend-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:9090']
    relabel_configs:
      - target_label: service
        replacement: 'backend-service'

  # ── ML Prediction Service (Python/Flask) ──
  - job_name: 'ml-prediction-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['host.docker.internal:8085']
    relabel_configs:
      - target_label: service
        replacement: 'ml-prediction-service'
