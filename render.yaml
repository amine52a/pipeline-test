services:

  # ─── ANGULAR FRONTEND (Static Site - FREE) ───────────────────────────────────
  # Pre-built dist is committed to git — no build needed on Render
  - type: web
    name: matchy-frontend
    runtime: static
    staticPublishPath: dist/matchy-angular/browser
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # ─── NODE.JS BACKEND (Web Service - FREE) ────────────────────────────────────
  - type: web
    name: matchy-backend
    runtime: node
    rootDir: backend
    buildCommand: npm ci --only=production
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SKIP_EUREKA
        value: "true"
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: matchy_db
      - key: DB_PORT
        value: "3306"
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://matchy-frontend.onrender.com
