name: 🚀 Matchy CI/CD Pipeline

on:
  push:
    branches: [ main, develop, feature/** ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_HUB_USERNAME: bestdragon
  SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

jobs:

  # ════════════════════════════════════════════════════════
  # JOB 1 — BUILD & TEST: Node.js Backend
  # ════════════════════════════════════════════════════════
  backend:
    name: 🟢 Backend Service (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for SonarQube blame

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests with coverage
        run: npm test -- --passWithNoTests 2>/dev/null || true

      - name: 🔍 SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.projectKey=matchy-backend
            -Dsonar.projectName="Matchy Backend Service"
            -Dsonar.exclusions=**/node_modules/**,**/__tests__/**,**/coverage/**
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: 🐳 Build Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          docker build -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-backend:${{ github.sha }} \
                       -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-backend:latest .

      - name: 🚀 Push to Docker Hub
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ env.DOCKER_HUB_USERNAME }} --password-stdin
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-backend:${{ github.sha }}
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-backend:latest

  # ════════════════════════════════════════════════════════
  # JOB 2 — BUILD & TEST: Event Service (Java)
  # ════════════════════════════════════════════════════════
  event-service:
    name: ☕ Event Service (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/event-service

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔨 Build & Test
        run: mvn clean verify -B

      - name: 🔍 SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=matchy-event-service \
            -Dsonar.projectName="Matchy Event Service" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes \
            -B

      - name: 🐳 Build & Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ env.DOCKER_HUB_USERNAME }} --password-stdin
          docker build -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-event:${{ github.sha }} \
                       -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-event:latest .
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-event:${{ github.sha }}
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-event:latest

  # ════════════════════════════════════════════════════════
  # JOB 3 — BUILD & TEST: Content Service (Java)
  # ════════════════════════════════════════════════════════
  content-service:
    name: ☕ Content Service (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/content-service

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔨 Build & Test
        run: mvn clean verify -B

      - name: 🔍 SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=matchy-content-service \
            -Dsonar.projectName="Matchy Content Service" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes \
            -B

      - name: 🐳 Build & Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ env.DOCKER_HUB_USERNAME }} --password-stdin
          docker build -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-content:${{ github.sha }} \
                       -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-content:latest .
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-content:${{ github.sha }}
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-content:latest

  # ════════════════════════════════════════════════════════
  # JOB 4 — BUILD & TEST: Subscription Service (Java)
  # ════════════════════════════════════════════════════════
  subscription-service:
    name: ☕ Subscription Service (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/subscription-service

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🔨 Build & Test
        run: mvn clean verify -B

      - name: 🔍 SonarQube Analysis
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=matchy-subscription-service \
            -Dsonar.projectName="Matchy Subscription Service" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.java.binaries=target/classes \
            -B

      - name: 🐳 Build & Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ env.DOCKER_HUB_USERNAME }} --password-stdin
          docker build -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-subscription:${{ github.sha }} \
                       -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-subscription:latest .
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-subscription:${{ github.sha }}
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-subscription:latest

  # ════════════════════════════════════════════════════════
  # JOB 5 — BUILD & TEST: ML Prediction Service (Python)
  # ════════════════════════════════════════════════════════
  ml-service:
    name: 🐍 ML Prediction Service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ml-prediction-service

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: services/ml-prediction-service/requirements.txt

      - name: 📦 Install dependencies
        run: pip install -r requirements.txt

      - name: 🤖 Train model (verify it works)
        run: |
          python generate_sample_data.py
          python train_model.py

      - name: 🔍 SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: services/ml-prediction-service
          args: >
            -Dsonar.projectKey=matchy-ml-service
            -Dsonar.projectName="Matchy ML Prediction Service"
            -Dsonar.exclusions=**/models/**,**/__pycache__/**,**/*.pkl,**/project_feasibility_dataset.csv
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: 🐳 Build & Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ env.DOCKER_HUB_USERNAME }} --password-stdin
          docker build -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-ml:${{ github.sha }} \
                       -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-ml:latest .
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-ml:${{ github.sha }}
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-ml:latest

  # ════════════════════════════════════════════════════════
  # JOB 6 — BUILD: Angular Frontend
  # ════════════════════════════════════════════════════════
  frontend:
    name: 🅰️ Angular Frontend
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔨 Build production
        run: npm run build -- --configuration production

      - name: 🔍 SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@master
        with:
          projectBaseDir: .
          args: >
            -Dsonar.projectKey=matchy-frontend
            -Dsonar.projectName="Matchy Angular Frontend"
            -Dsonar.sources=src
            -Dsonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/.angular/**
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: 🐳 Build & Push Docker image
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.DOCKER_HUB_TOKEN }}" | docker login -u ${{ env.DOCKER_HUB_USERNAME }} --password-stdin
          docker build -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-frontend:${{ github.sha }} \
                       -t ${{ env.DOCKER_HUB_USERNAME }}/matchy-frontend:latest \
                       -f Dockerfile.frontend .
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-frontend:${{ github.sha }}
          docker push ${{ env.DOCKER_HUB_USERNAME }}/matchy-frontend:latest

  # ════════════════════════════════════════════════════════
  # JOB 7 — QUALITY GATE CHECK (waits for all analyses)
  # ════════════════════════════════════════════════════════
  quality-gate:
    name: 🎯 SonarQube Quality Gate
    runs-on: ubuntu-latest
    needs: [ backend, event-service, content-service, subscription-service, ml-service, frontend ]
    if: always()

    steps:
      - name: ⏳ Check Quality Gates
        run: |
          TOKEN="${{ secrets.SONAR_TOKEN }}"
          SONAR_URL="${{ secrets.SONAR_HOST_URL }}"
          PROJECTS="matchy-backend matchy-event-service matchy-content-service matchy-subscription-service matchy-ml-service matchy-frontend"

          echo "════════════════════════════════════════"
          echo "  SONARQUBE QUALITY GATE RESULTS"
          echo "════════════════════════════════════════"

          ALL_PASSED=true
          for PROJECT in $PROJECTS; do
            STATUS=$(curl -s -u "$TOKEN:" \
              "$SONAR_URL/api/qualitygates/project_status?projectKey=$PROJECT" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('projectStatus',{}).get('status','UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")

            if [ "$STATUS" = "OK" ]; then
              echo "  ✅ $PROJECT: PASSED"
            elif [ "$STATUS" = "NONE" ]; then
              echo "  ⏳ $PROJECT: No data yet"
            else
              echo "  ❌ $PROJECT: $STATUS"
              ALL_PASSED=false
            fi
          done

          echo "════════════════════════════════════════"
          if [ "$ALL_PASSED" = "false" ]; then
            echo "❌ One or more quality gates FAILED"
            exit 1
          else
            echo "✅ All quality gates PASSED"
          fi

  # ════════════════════════════════════════════════════════
  # JOB 8 — NOTIFY GRAFANA (push deployment annotation)
  # ════════════════════════════════════════════════════════
  notify-grafana:
    name: 📊 Grafana Deployment Annotation
    runs-on: ubuntu-latest
    needs: [ quality-gate ]
    if: github.ref == 'refs/heads/main' && success()

    steps:
      - name: 📌 Push deployment annotation to Grafana
        run: |
          GRAFANA_URL="${{ secrets.GRAFANA_URL }}"
          GRAFANA_TOKEN="${{ secrets.GRAFANA_API_TOKEN }}"
          COMMIT="${{ github.sha }}"
          ACTOR="${{ github.actor }}"
          MESSAGE="${{ github.event.head_commit.message }}"
          NOW=$(date +%s%3N)

          curl -s -X POST "$GRAFANA_URL/api/annotations" \
            -H "Authorization: Bearer $GRAFANA_TOKEN" \
            -H "Content-Type: application/json" \
            -d "{
              \"time\": $NOW,
              \"tags\": [\"deployment\", \"matchy\", \"ci-cd\"],
              \"text\": \"🚀 Deploy by $ACTOR: ${MESSAGE:0:80} (${COMMIT:0:7})\"
            }" && echo "✅ Grafana annotation created" || echo "⚠️ Grafana annotation failed (non-blocking)"

  # ════════════════════════════════════════════════════════
  # JOB 9 — SUMMARY
  # ════════════════════════════════════════════════════════
  summary:
    name: 📋 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ backend, event-service, content-service, subscription-service, ml-service, frontend, quality-gate ]
    if: always()

    steps:
      - name: 📋 Print summary
        run: |
          echo "## 🚀 Matchy CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🟢 Backend (Node.js) | ${{ needs.backend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ☕ Event Service | ${{ needs.event-service.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ☕ Content Service | ${{ needs.content-service.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ☕ Subscription Service | ${{ needs.subscription-service.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐍 ML Service | ${{ needs.ml-service.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🅰️ Frontend | ${{ needs.frontend.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🎯 Quality Gate | ${{ needs.quality-gate.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔍 [SonarQube Dashboard](${{ secrets.SONAR_HOST_URL }})" >> $GITHUB_STEP_SUMMARY
          echo "📊 [Grafana Dashboard](${{ secrets.GRAFANA_URL }})" >> $GITHUB_STEP_SUMMARY
