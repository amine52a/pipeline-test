name: 🚀 Matchy CI/CD Pipeline

on:
  push:
    branches: [ main, develop, "feature/**" ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_HUB_USERNAME: bestdragon
  # SonarQube runs inside this workflow — no external server needed
  SONAR_HOST_URL: http://localhost:9000
  SONAR_TOKEN: admin

jobs:

  # ════════════════════════════════════════════════════════
  # JOB 1 — SONARQUBE SERVER (shared service for all jobs)
  # Spins up SonarQube inside the runner, analyses all code,
  # then exports a report artifact.
  # ════════════════════════════════════════════════════════
  sonarqube-analysis:
    name: 🔍 SonarQube Analysis (all services)
    runs-on: ubuntu-latest

    services:
      sonarqube:
        image: sonarqube:lts-community
        ports:
          - 9000:9000
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        options: >-
          --health-cmd "curl -f http://localhost:9000/api/system/status | grep -q UP"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Wait for SonarQube to be fully ready ──
      - name: ⏳ Wait for SonarQube
        run: |
          echo "Waiting for SonarQube..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s http://localhost:9000/api/system/status | python3 -c "import sys,json; print(json.load(sys.stdin).get('status',''))" 2>/dev/null)
            if [ "$STATUS" = "UP" ]; then
              echo "✅ SonarQube is UP"
              break
            fi
            echo "  Attempt $i/30 — status: $STATUS"
            sleep 10
          done

      # ── Change default password & create projects ──
      - name: 🔧 Setup SonarQube projects
        run: |
          # Change password
          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password" \
            -d "login=admin&previousPassword=admin&password=matchy2024"

          # Create all projects
          for KEY in matchy-backend matchy-event-service matchy-content-service \
                     matchy-subscription-service matchy-ml-service matchy-frontend; do
            curl -s -u admin:matchy2024 -X POST "http://localhost:9000/api/projects/create" \
              -d "project=$KEY&name=$KEY&visibility=public" > /dev/null
            echo "✅ Project: $KEY"
          done

      # ── Java 17 for Maven analyses ──
      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # ── Node.js for backend & frontend ──
      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ── Python for ML service ──
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── Analyse: Event Service ──
      - name: 🔍 Analyse Event Service
        working-directory: services/event-service
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=matchy-event-service \
            -Dsonar.projectName="Matchy Event Service" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=matchy2024 \
            -Dsonar.java.binaries=target/classes \
            -B -q || true

      # ── Analyse: Content Service ──
      - name: 🔍 Analyse Content Service
        working-directory: services/content-service
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=matchy-content-service \
            -Dsonar.projectName="Matchy Content Service" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=matchy2024 \
            -Dsonar.java.binaries=target/classes \
            -B -q || true

      # ── Analyse: Subscription Service ──
      - name: 🔍 Analyse Subscription Service
        working-directory: services/subscription-service
        run: |
          mvn sonar:sonar \
            -Dsonar.projectKey=matchy-subscription-service \
            -Dsonar.projectName="Matchy Subscription Service" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=matchy2024 \
            -Dsonar.java.binaries=target/classes \
            -B -q || true

      # ── Analyse: Backend (Node.js) ──
      - name: 🔍 Analyse Backend (Node.js)
        run: |
          npm ci --prefix backend
          npx --yes sonar-scanner \
            -Dsonar.projectKey=matchy-backend \
            -Dsonar.projectName="Matchy Backend Service" \
            -Dsonar.sources=backend \
            -Dsonar.exclusions="**/node_modules/**,**/__tests__/**" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=matchy2024 || true

      # ── Analyse: ML Service (Python) ──
      - name: 🔍 Analyse ML Service (Python)
        run: |
          pip install -r services/ml-prediction-service/requirements.txt -q
          npx --yes sonar-scanner \
            -Dsonar.projectKey=matchy-ml-service \
            -Dsonar.projectName="Matchy ML Prediction Service" \
            -Dsonar.sources=services/ml-prediction-service \
            -Dsonar.exclusions="**/models/**,**/__pycache__/**,**/*.pkl,**/project_feasibility_dataset.csv" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=matchy2024 || true

      # ── Analyse: Angular Frontend ──
      - name: 🔍 Analyse Angular Frontend
        run: |
          npm ci
          npx --yes sonar-scanner \
            -Dsonar.projectKey=matchy-frontend \
            -Dsonar.projectName="Matchy Angular Frontend" \
            -Dsonar.sources=src \
            -Dsonar.exclusions="**/node_modules/**,**/dist/**,**/*.spec.ts" \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.login=admin \
            -Dsonar.password=matchy2024 || true

      # ── Export SonarQube report ──
      - name: 📊 Export SonarQube Report
        run: |
          mkdir -p sonar-reports
          TOKEN_B64=$(echo -n "admin:matchy2024" | base64)

          for KEY in matchy-backend matchy-event-service matchy-content-service \
                     matchy-subscription-service matchy-ml-service matchy-frontend; do
            echo "Fetching report for $KEY..."
            curl -s -H "Authorization: Basic $TOKEN_B64" \
              "http://localhost:9000/api/measures/component?component=$KEY&metricKeys=bugs,vulnerabilities,code_smells,coverage,duplicated_lines_density,ncloc,alert_status" \
              > "sonar-reports/$KEY.json" 2>/dev/null || echo "{}" > "sonar-reports/$KEY.json"
          done

          # Generate HTML summary
          python3 << 'EOF'
          import json, os, glob

          html = """<!DOCTYPE html>
          <html><head><meta charset="UTF-8">
          <title>Matchy SonarQube Report</title>
          <style>
            body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
            h1 { color: #1a1a2e; }
            .card { background: white; border-radius: 8px; padding: 20px; margin: 15px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
            .metric { display: inline-block; margin: 8px; padding: 10px 15px; border-radius: 6px; background: #f0f0f0; }
            .ok { background: #d4edda; color: #155724; }
            .warn { background: #fff3cd; color: #856404; }
            .fail { background: #f8d7da; color: #721c24; }
            h2 { color: #333; margin-bottom: 10px; }
          </style></head><body>
          <h1>🔍 Matchy SonarQube Analysis Report</h1>
          <p>Generated by GitHub Actions — Commit: """ + os.environ.get('GITHUB_SHA','N/A')[:7] + """</p>"""

          for f in sorted(glob.glob('sonar-reports/*.json')):
              project = os.path.basename(f).replace('.json','')
              try:
                  data = json.load(open(f))
                  measures = {m['metric']: m.get('value','N/A') for m in data.get('component',{}).get('measures',[])}
                  status = measures.get('alert_status','NONE')
                  css = 'ok' if status == 'OK' else 'fail' if status == 'ERROR' else 'warn'
                  html += f'<div class="card"><h2>{project}</h2>'
                  html += f'<span class="metric {css}">Quality Gate: {status}</span>'
                  for k,v in measures.items():
                      if k != 'alert_status':
                          html += f'<span class="metric">{k}: {v}</span>'
                  html += '</div>'
              except:
                  html += f'<div class="card"><h2>{project}</h2><p>No data yet</p></div>'

          html += '</body></html>'
          open('sonar-reports/index.html','w').write(html)
          print("✅ HTML report generated")
          EOF

      - name: 📤 Upload SonarQube Report
        uses: actions/upload-artifact@v4
        with:
          name: sonarqube-report-${{ github.sha }}
          path: sonar-reports/
          retention-days: 30

  # ════════════════════════════════════════════════════════
  # JOB 2 — BUILD & TEST ALL SERVICES
  # ════════════════════════════════════════════════════════
  build-and-test:
    name: 🔨 Build & Test All Services
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🔨 Build Event Service
        working-directory: services/event-service
        run: mvn clean package -DskipTests -B -q

      - name: 🔨 Build Content Service
        working-directory: services/content-service
        run: mvn clean package -DskipTests -B -q

      - name: 🔨 Build Subscription Service
        working-directory: services/subscription-service
        run: mvn clean package -DskipTests -B -q

      - name: 🔨 Build Eureka Server
        working-directory: eureka-server
        run: mvn clean package -DskipTests -B -q

      - name: 🔨 Build API Gateway
        working-directory: api-gateway
        run: mvn clean package -DskipTests -B -q

      - name: 🔨 Build Backend (Node.js)
        working-directory: backend
        run: npm ci

      - name: 🧪 Test Backend
        working-directory: backend
        run: npm test -- --passWithNoTests 2>/dev/null || true

      - name: 🔨 Build Angular Frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: 🐍 Setup ML Service
        working-directory: services/ml-prediction-service
        run: |
          pip install -r requirements.txt -q
          python generate_sample_data.py
          python train_model.py

  # ════════════════════════════════════════════════════════
  # JOB 3 — DOCKER BUILD & PUSH (only on main branch)
  # ════════════════════════════════════════════════════════
  docker-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🔑 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: bestdragon
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🐳 Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            bestdragon/matchy-backend:latest
            bestdragon/matchy-backend:${{ github.sha }}

      - name: 🐳 Build & Push Event Service
        uses: docker/build-push-action@v5
        with:
          context: ./services
          file: ./services/event-service/Dockerfile
          push: true
          tags: |
            bestdragon/matchy-event:latest
            bestdragon/matchy-event:${{ github.sha }}

      - name: 🐳 Build & Push Content Service
        uses: docker/build-push-action@v5
        with:
          context: ./services
          file: ./services/content-service/Dockerfile
          push: true
          tags: |
            bestdragon/matchy-content:latest
            bestdragon/matchy-content:${{ github.sha }}

      - name: 🐳 Build & Push Subscription Service
        uses: docker/build-push-action@v5
        with:
          context: ./services
          file: ./services/subscription-service/Dockerfile
          push: true
          tags: |
            bestdragon/matchy-subscription:latest
            bestdragon/matchy-subscription:${{ github.sha }}

      - name: 🐳 Build & Push ML Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/ml-prediction-service
          file: ./services/ml-prediction-service/Dockerfile
          push: true
          tags: |
            bestdragon/matchy-ml:latest
            bestdragon/matchy-ml:${{ github.sha }}

      - name: 🐳 Build & Push Eureka Server
        uses: docker/build-push-action@v5
        with:
          context: ./eureka-server
          file: ./eureka-server/Dockerfile
          push: true
          tags: |
            bestdragon/matchy-eureka:latest
            bestdragon/matchy-eureka:${{ github.sha }}

      - name: 🐳 Build & Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          file: ./api-gateway/Dockerfile
          push: true
          tags: |
            bestdragon/matchy-gateway:latest
            bestdragon/matchy-gateway:${{ github.sha }}

  # ════════════════════════════════════════════════════════
  # JOB 4 — DEPLOY TO GITHUB PAGES (Angular Frontend)
  # Runs only on main branch after build passes
  # Setup: GitHub repo → Settings → Pages → Source: GitHub Actions
  # ════════════════════════════════════════════════════════
  deploy-pages:
    name: 🌍 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: [ build-and-test ]
    if: github.ref == 'refs/heads/main' && needs.build-and-test.result == 'success'
    
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write
      id-token: write
      contents: read

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 🔨 Build Angular Frontend for GitHub Pages
        run: |
          npm ci
          # Extract repo name from GITHUB_REPOSITORY (owner/repo-name)
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          echo "Building for base href: /$REPO_NAME/"
          npm run build -- --configuration production --base-href "/$REPO_NAME/"

      - name: 📦 Setup Pages
        uses: actions/configure-pages@v4

      - name: 📤 Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist/matchy-angular/browser'

      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ════════════════════════════════════════════════════════
  # JOB 5 — PIPELINE SUMMARY
  # ════════════════════════════════════════════════════════
  summary:
    name: 📋 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [ sonarqube-analysis, build-and-test, docker-push, deploy-pages ]
    if: always()

    steps:
      - name: 📋 Write summary
        run: |
          echo "## 🚀 Matchy CI/CD Pipeline — Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Result |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 SonarQube Analysis | ${{ needs.sonarqube-analysis.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Build & Test | ${{ needs.build-and-test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🐳 Docker Push | ${{ needs.docker-push.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🌍 Deploy to GitHub Pages | ${{ needs.deploy-pages.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**By:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📥 Download the **sonarqube-report** artifact to see code quality." >> $GITHUB_STEP_SUMMARY
          echo "🐳 Docker images: \`https://hub.docker.com/u/bestdragon\`" >> $GITHUB_STEP_SUMMARY
          REPO_NAME=$(echo $GITHUB_REPOSITORY | cut -d'/' -f2)
          echo "🌍 Live app: \`https://${{ github.repository_owner }}.github.io/$REPO_NAME/\`" >> $GITHUB_STEP_SUMMARY
