name: Matchy Platform - CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/matchy

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Build & Test Angular Frontend
  # ─────────────────────────────────────────────────────────────────────────────
  build-frontend:
    name: 🌐 Build Angular Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/matchy-angular/browser
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Build & Test Node.js Backend
  # ─────────────────────────────────────────────────────────────────────────────
  build-backend:
    name: 🟢 Build Node.js Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || true

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Build Java Microservices
  # ─────────────────────────────────────────────────────────────────────────────
  build-java-services:
    name: ☕ Build Java Microservices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build Eureka Server
        run: mvn clean package -DskipTests
        working-directory: ./eureka-server

      - name: Build API Gateway
        run: mvn clean package -DskipTests
        working-directory: ./api-gateway

      - name: Build all microservices
        run: mvn clean package -DskipTests
        working-directory: ./services

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 4: Build Python ML Services
  # ─────────────────────────────────────────────────────────────────────────────
  build-ml-services:
    name: 🤖 Build ML Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test ML Matching imports
        run: |
          pip install -r requirements.txt --quiet
          python -c "import fastapi, joblib, pandas, sklearn; print('✅ Matching deps OK')"
        working-directory: ./Matching_Ml/Matching_services

      - name: Test ML Prix imports
        run: |
          pip install -r requirements.txt --quiet
          python -c "import fastapi, joblib, xgboost; print('✅ Prix deps OK')"
        working-directory: ./Matching_Ml/Prix_services

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 5: Build & Push Docker Images (only on push to main)
  # ─────────────────────────────────────────────────────────────────────────────
  build-docker-images:
    name: 🐳 Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend, build-java-services, build-ml-services]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17 (for building JARs)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'
          cache: 'maven'

      - name: Build all JARs
        run: |
          mvn clean package -DskipTests -f eureka-server/pom.xml
          mvn clean package -DskipTests -f api-gateway/pom.xml
          mvn clean package -DskipTests -f services/pom.xml

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Eureka
        uses: docker/build-push-action@v5
        with:
          context: ./eureka-server
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-eureka:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push API Gateway
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ML Matching
        uses: docker/build-push-action@v5
        with:
          context: ./Matching_Ml/Matching_services
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ml-matching:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ML Prix
        uses: docker/build-push-action@v5
        with:
          context: ./Matching_Ml/Prix_services
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ml-prix:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ML Profil
        uses: docker/build-push-action@v5
        with:
          context: ./Matching_Ml/Profil_services
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ml-profil:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push ML Feasibility
        uses: docker/build-push-action@v5
        with:
          context: ./Matching_Ml/Project_feasibility_services
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-ml-feasibility:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 6: Deploy Frontend to Vercel
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-frontend-vercel:
    name: 🚀 Deploy Frontend → Vercel
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build for production
        run: npm run build -- --configuration production
        env:
          NODE_OPTIONS: --max_old_space_size=4096

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./
          vercel-args: '--prod'

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 7: Deploy Backend + Services to Railway
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-backend-railway:
    name: 🚂 Deploy Backend → Railway
    runs-on: ubuntu-latest
    needs: [build-docker-images]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend to Railway
        run: railway up --service backend --detach
        working-directory: ./backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 8: Pipeline Summary
  # ─────────────────────────────────────────────────────────────────────────────
  pipeline-summary:
    name: 📊 Pipeline Summary
    runs-on: ubuntu-latest
    needs: [deploy-frontend-vercel, deploy-backend-railway]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## 🚀 Matchy Platform Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Angular Frontend | Deployed to Vercel |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Backend | Deployed to Railway |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker Images | Pushed to GHCR |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Docker Images Available:" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/matchy-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/matchy-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/matchy-eureka:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/matchy-gateway:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/matchy-ml-matching:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/matchy-ml-prix:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/matchy-ml-profil:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ github.repository_owner }}/matchy-ml-feasibility:latest\`" >> $GITHUB_STEP_SUMMARY
