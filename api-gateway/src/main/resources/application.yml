server:
  port: 8091
  max-http-header-size: 10MB

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 10MB
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # Order matters — more specific routes first.
        - id: event-service
          uri: lb://event-service
          predicates:
            - Path=/api/evenements/**,/api/registrations/**,/api/chat/**
        - id: content-service
          uri: lb://content-service
          predicates:
            - Path=/api/Content/**,/api/Assessment/**,/api/Certification/**,/api/Favorite/**,/api/Translation/**,/api/User/**
        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/api/Subscription/**,/api/Payment/**,/api/Plan/**,/api/PromoCode/**,/api/PayPal/**,/api/Flouci/**
        - id: backend-service
          uri: lb://backend-service
          predicates:
            - Path=/api/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    prometheus:
      enabled: true
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true
