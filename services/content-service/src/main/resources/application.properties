spring.application.name=content-service
server.port=8083
server.servlet.context-path=/

# Base de donnees unique pour tout
spring.datasource.url=jdbc:mysql://localhost:3306/matchy_content?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.hostname=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.matchy=DEBUG

spring.cloud.openfeign.enabled=true
spring.cloud.openfeign.eureka.enabled=true

# Feign logging — affiche les appels inter-services dans la console
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=BASIC
logging.level.org.example.contentservice.client=DEBUG

