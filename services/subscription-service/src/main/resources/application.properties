spring.application.name=subscription-service
server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/matchy_sub?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.instance.prefer-ip-address=true

spring.cloud.config.enabled=false

# Matchy User Microservice (Node backend) for user data hydration
matchy.backend.url=http://localhost:9090/api

# Mail (Mailtrap Sandbox)
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=aaddc029a34a3f
spring.mail.password=2fe7b37e5a1862
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.default-encoding=UTF-8

# Flouci Payment Gateway (placeholders - replace with real credentials)
flouci.app_token=your_flouci_app_token
flouci.app_secret=your_flouci_app_secret
flouci.success_url=http://localhost:4200/payment-success
flouci.fail_url=http://localhost:4200/payment-fail

# PayPal (placeholders)
paypal.client.id=your_client_id
paypal.client.secret=your_client_secret
paypal.mode=sandbox
paypal.success.url=http://localhost:4200/payment-success
paypal.cancel.url=http://localhost:4200/payment-cancel

# ── Actuator / Prometheus ──
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.prometheus.enabled=true
management.endpoint.health.show-details=always
management.metrics.export.prometheus.enabled=true
