# Server Configuration
server.port=8081
server.servlet.context-path=/

# Database Configuration (shared matchy_db with the Node backend)
spring.datasource.url=jdbc:mysql://localhost:3306/matchy_db?createDatabaseIfNotExist=false&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Logging
logging.level.org.springframework.web=INFO
logging.level.com.matchy=DEBUG
logging.level.org.springframework.cloud.netflix.eureka.EurekaServiceRegistry=INFO

# Application Name (for Eureka)
spring.application.name=event-service

# Shared JWT secret — must match the JWT_SECRET env var used by the Node backend
matchy.jwt.secret=${JWT_SECRET:dev-shared-secret-change-me-please-please-please-32bytes}

# Eureka Client Configuration
eureka.client.service-url.defaultZone=http://127.0.0.1:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.healthcheck.enabled=true

# Instance Configuration
eureka.instance.hostname=127.0.0.1
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=127.0.0.1
eureka.instance.lease-renewal-interval-in-seconds=10
eureka.instance.lease-expiration-duration-in-seconds=30
eureka.instance.health-check-url-path=/actuator/health
eureka.instance.status-page-url-path=/actuator/info

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Groq AI API - Set via environment variable GROQ_API_KEY
# Get your free key at https://console.groq.com
groq.api.key=${GROQ_API_KEY:your-groq-api-key-here}

# Application Info (shown in Eureka Dashboard)
info.app.name=Matchy Backend
info.app.description=Event Management and Registration Service
info.app.version=1.0.0

# Feign logging — affiche les appels inter-services dans la console
feign.client.config.default.connectTimeout=3000
feign.client.config.default.readTimeout=5000
feign.client.config.default.loggerLevel=BASIC
logging.level.com.matchy.client=DEBUG
